name: Generate terraform docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # A fork PR cannot be pushed to, so skip rather than fail the check.
    # Maintainers regenerate on their own branch, or via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_wrapper: false

    # Applies examples/complete, extracts the manifest, and injects the Example
    # section into docs/.header.md. Same script maintainers run locally.
    - name: Regenerate example artifacts
      run: ./scripts/generate-example.sh

    # Runs after the header has been updated, so README.md picks up the new
    # Example section in the same pass. git-push is false: the commit below
    # carries the example artifacts too, which this action would not.
    - name: Render terraform docs
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: .
        output-file: README.md
        output-method: inject
        git-push: "false"

    - name: Commit regenerated docs and example
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "No documentation changes."
        else
          git commit -m "docs: automated update of terraform docs and example manifest"
          git push
        fi
