name: Generate terraform docs

on:
  pull_request:
  workflow_dispatch:

# Read-only on purpose. This job runs `tofu init && tofu apply`, which downloads
# and EXECUTES third-party provider binaries and module code. That must not
# happen in a job holding a token that can push. The job therefore verifies the
# committed artifacts rather than regenerating them in place; a maintainer
# regenerates locally and commits, which also keeps every commit attributable to
# a person (the repo ruleset requires extra approval for unattributed changes,
# and a bot-pushed head SHA parks the required checks workflow).
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_wrapper: false

    # Must run the script unmodified rather than diffing raw apply output: the
    # manifest's root_config.git_commit tracks the branch HEAD, so a naive diff
    # would fail on every PR. The script's restore guard neutralizes exactly that.
    - name: Regenerate example artifacts
      run: ./scripts/generate-example.sh

    - name: Render terraform docs
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: .
        output-file: README.md
        output-method: inject
        git-push: "false"

    - name: Verify committed artifacts are up to date
      run: |
        # The terraform-docs action runs as root in a container.
        sudo chown -R "$(id -u):$(id -g)" .
        if ! git diff --exit-code --stat; then
          echo "::error::Generated files are out of date. Run ./scripts/generate-example.sh locally and commit the result."
          git diff
          exit 1
        fi
        echo "Generated files are up to date."
